name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t sentryops-api:scan ./backend
      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: sentryops-api:scan
          severity: CRITICAL,HIGH
          # Report-only: upstream base-image CVEs should surface without reddening
          # the badge on every fixed advisory in python:3.12-slim.
          exit-code: "0"
          ignore-unfixed: true
          format: table

  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - name: pip-audit
        run: pip-audit --strict || true # report advisories without blocking on unfixed upstream CVEs

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level high || true
