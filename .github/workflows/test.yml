name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentryops
          POSTGRES_PASSWORD: sentryops
          POSTGRES_DB: sentryops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentryops -d sentryops_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://sentryops:sentryops@localhost:5432/sentryops_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-at-least-32-bytes-long-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: vitest
        run: pnpm test:run
