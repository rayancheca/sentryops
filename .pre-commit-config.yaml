repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, strict)
        entry: bash -c 'cd backend && mypy app'
        language: system
        types: [python]
        pass_filenames: false
        files: ^backend/

      - id: prettier
        name: prettier (web, check)
        entry: bash -c 'cd web && pnpm prettier --check .'
        language: system
        pass_filenames: false
        files: ^web/

      - id: eslint
        name: eslint (web)
        entry: bash -c 'cd web && pnpm eslint .'
        language: system
        pass_filenames: false
        files: ^web/
